<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Upload Championship PDF</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --surface-color: #111827;
            --surface-border: #1f2937;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
        }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg-color); color: var(--text-main); padding: 40px 20px; }
        .container { max-width: 600px; margin: 0 auto; background: var(--surface-color); border: 1px solid var(--surface-border); padding: 32px; border-radius: 12px; }
        h1 { margin-bottom: 8px; font-size: 22px; }
        p { color: var(--text-muted); font-size: 14px; margin-bottom: 24px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 8px; color: var(--text-muted); }
        input[type="text"], input[type="number"], input[type="url"], input[type="file"] {
            width: 100%; background: var(--bg-color); border: 1px solid var(--surface-border); color: var(--text-main);
            padding: 12px; border-radius: 8px; font-family: inherit; font-size: 14px; outline: none;
        }
        button { background: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; width: 100%; }
        button:hover { background: var(--primary-hover); }
        .back-link { display: block; text-align: center; margin-top: 16px; color: var(--text-muted); text-decoration: none; font-size: 13px; }
        .back-link:hover { color: var(--text-main); }
    </style>
</head>
<body>
    <div class="container">
        <h1>Upload Championship PDF</h1>
        <p>Provide championship metadata and upload the official PDF communique document to ingest and classify records.</p>
        
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="form-group">
                <label>Championship Edition</label>
                {{ form.edition }}
            </div>
            <div class="form-group">
                <label>Year</label>
                {{ form.year }}
            </div>
            <div class="form-group">
                <label>Venue</label>
                {{ form.venue }}
            </div>
            <div class="form-group">
                <label>Source URL</label>
                {{ form.source_url }}
            </div>
            <div class="form-group">
                <label>PDF Communique File</label>
                {{ form.pdf_file }}
            </div>
            <button type="submit">Upload &amp; Extract PDF</button>
        </form>
        <a href="{% url 'browse_results' %}" class="back-link">&larr; Back to Results Browser</a>
    </div>
</body>
</html>
